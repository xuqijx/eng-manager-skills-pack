name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the skill pack
        run: python3 -m empack check
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . -v
